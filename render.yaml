services:
  # Web Service Deployment (Full React Analytics UI + Express API Server)
  - type: web
    name: olist-analytics-platform
    runtime: node
    buildCommand: python3 backend/init_db.py && npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
