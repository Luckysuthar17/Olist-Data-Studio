services:
  # Python FastAPI Web Service (Pure Python + SQLite + Pandas API Backend)
  - type: web
    name: olist-fastapi-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python3 backend/init_db.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
